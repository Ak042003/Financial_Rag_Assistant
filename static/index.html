<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial RAG Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --primary-color: #007bff;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-color: #343a40;
            --border-color: #dee2e6;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 2rem;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #212529;
            margin: 0;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }

        main {
            background: var(--card-background);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 2rem;
        }
        
        #queryForm {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
        }

        #queryInput, #retrieverSelect {
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        #queryInput:focus, #retrieverSelect:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }

        button[type="submit"] {
            padding: 14px 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #a0c7ff;
            cursor: not-allowed;
        }

        #result {
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            min-height: 150px;
            line-height: 1.7;
            color: var(--text-color);
        }
        
        /* Markdown rendering styles */
        #result h2 { margin-top: 0; font-size: 1.5rem; }
        #result table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        #result th, #result td { padding: 12px; border: 1px solid var(--border-color); text-align: left; }
        #result th { background-color: #f8f9fa; }
        #result code { background-color: #e9ecef; padding: 2px 6px; border-radius: 4px; }
        #result blockquote { border-left: 4px solid var(--border-color); padding-left: 1rem; margin-left: 0; color: #6c757d; }
        
        .loader { text-align: center; padding: 2rem; }
        .clarification-options button {
            background-color: #e9ecef;
            color: #343a40;
            margin: 0.25rem;
            font-size: 14px;
            padding: 8px 12px;
            transition: background-color 0.2s;
        }
        .clarification-options button:hover {
            background-color: #d1d5db;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Financial Assistant</h1>
            <p class="subtitle">Your AI-powered guide for financial data.</p>
        </header>
        
        <main>
            <form id="queryForm">
                <input type="text" id="queryInput" placeholder="e.g., Compare top 3 funds by Sharpe Ratio" required>
                <select id="retrieverSelect">
                    <option value="hybrid" selected>Hybrid Search</option>
                    <option value="semantic">Semantic Search</option>
                    <option value="lexical">Lexical Search</option>
                </select>
                <button type="submit">Ask</button>
            </form>
            <div id="result"><p>Your results will appear here.</p></div>
        </main>
    </div>

    <script>
        // --- JAVASCRIPT IS UNCHANGED ---
        const form = document.getElementById('queryForm');
        const input = document.getElementById('queryInput');
        const select = document.getElementById('retrieverSelect');
        const resultDiv = document.getElementById('result');
        const submitButton = form.querySelector('button');

        let originalQuery = '';

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const query = input.value;
            originalQuery = query;
            await sendQuery(query, select.value);
        });

        async function sendQuery(query, search_mode) {
            resultDiv.innerHTML = '<div class="loader">🧠 Thinking...</div>';
            submitButton.disabled = true;

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, search_mode })
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const data = await response.json();

                if (data.status === 'clarification_needed') {
                    displayClarification(data.clarification);
                } else if (data.status === 'disambiguation_needed') {
                    displayDisambiguation(data.disambiguation);
                } else {
                    resultDiv.innerHTML = marked.parse(data.final_answer);
                }

            } catch (error) {
                console.error('Error fetching data:', error);
                resultDiv.innerHTML = `<p style="color: red;"><strong>Error:</strong> Could not get a response.</p>`;
            } finally {
                submitButton.disabled = false;
            }
        }

        function displayClarification(clarification) {
            resultDiv.innerHTML = `<div class="clarification-question">${clarification.question_text}</div><div class="clarification-options"></div>`;
            const optionsContainer = resultDiv.querySelector('.clarification-options');
            
            clarification.options.forEach(optionText => {
                const button = document.createElement('button');
                button.textContent = optionText;
                button.onclick = () => {
                    const reformulatedQuery = `${originalQuery} with a focus on ${optionText}`;
                    input.value = reformulatedQuery;
                    sendQuery(reformulatedQuery, select.value);
                };
                optionsContainer.appendChild(button);
            });
        }
        
        function displayDisambiguation(disambiguation) {
            resultDiv.innerHTML = `<div class="clarification-question">${disambiguation.question_text}</div><div class="clarification-options"></div>`;
            const optionsContainer = resultDiv.querySelector('.clarification-options');
            
            disambiguation.options.forEach(optionText => {
                const button = document.createElement('button');
                button.textContent = optionText;
                button.onclick = () => {
                    const reformulatedQuery = originalQuery.replace(disambiguation.original_name, optionText);
                    input.value = reformulatedQuery;
                    originalQuery = reformulatedQuery;
                    sendQuery(reformulatedQuery, select.value);
                };
                optionsContainer.appendChild(button);
            });
        }
    </script>
</body>
</html>
